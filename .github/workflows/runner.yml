name: AleXecutor Bot Runner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [bot-updated]

concurrency:
  group: bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: rendoyelaka/AleXecutor
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "python-telegram-bot[job-queue]==20.7" cryptography requests

      - name: Pull Data from Gist
        env:
          GH_PAT:  ${{ secrets.GH_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python persist.py pull || echo "[OK] No existing data - starting fresh"

      - name: Run Bot
        env:
          BOT_TOKEN:       ${{ secrets.BOT_TOKEN }}
          ADMIN_ID:        ${{ secrets.ADMIN_ID }}
          ENCRYPT_KEY:     ${{ secrets.ENCRYPT_KEY }}
          HMAC_SECRET:     ${{ secrets.HMAC_SECRET }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          SUPPORT_USER:    ${{ secrets.SUPPORT_USER }}
          GH_PAT:          ${{ secrets.GH_PAT }}
          GIST_ID:         ${{ secrets.GIST_ID }}
          GITHUB_REPO:     rendoyelaka/AleXecutor-Runner
        run: |
          MAX=5
          COUNT=0
          while [ $COUNT -lt $MAX ]; do
            echo "Starting bot attempt $((COUNT+1))/$MAX"
            python bot.py
            EXIT=$?
            COUNT=$((COUNT+1))
            if [ $EXIT -eq 0 ]; then
              echo "[OK] Bot stopped cleanly"
              break
            fi
            echo "[WARN] Crashed - restarting in 5s..."
            sleep 5
          done

      - name: Push Data to Gist
        if: always()
        env:
          GH_PAT:  ${{ secrets.GH_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python persist.py push || echo "[OK] Nothing to push"

  trigger-next:
    needs: run-bot
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'repository_dispatch' &&
      (needs.run-bot.result == 'success' || needs.run-bot.result == 'failure')
    steps:
      - name: Trigger next run
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'runner.yml',
              ref: 'main'
            });
            console.log('[OK] Next run triggered!');
